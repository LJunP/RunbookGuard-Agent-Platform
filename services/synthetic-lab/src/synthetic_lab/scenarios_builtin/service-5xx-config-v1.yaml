id: service-5xx-config-v1
version: 1
description: >
  synthetic-checkout 发布时把 auth.audience 配错，下游鉴权返回 401，
  本服务错误率升高。根因在本服务的配置变更，不是下游故障——
  检验 Agent 是否会去指责无辜的 synthetic-auth。对应 M0 场景 S3。
seed: 20260828
timeline:
  baseline_minutes: 30
  incident_minutes: 10
sample_interval_seconds: 30

services:
  - name: synthetic-checkout
    metrics:
      http_error_rate:
        baseline: 0.002
        incident: 0.18
        # step 而非 ramp：错误率的跃升与部署时刻对齐是本场景的关键论据。
        shape: step
        unit: ratio
      http_5xx_count:
        baseline: 1
        incident: 430
        shape: step
        unit: count
      http_4xx_count:
        baseline: 12
        incident: 980
        shape: step
        unit: count
      http_request_rate:
        baseline: 210
        incident: 210
        shape: flat
        unit: rps
      http_p99_latency_ms:
        baseline: 210
        incident: 260
        shape: flat
        unit: ms
    logs:
      - level: INFO
        message: "POST /api/checkout completed in 198ms"
        phase: baseline
        per_minute: 4
      - level: ERROR
        message: "401 from synthetic-auth: audience mismatch (expected api://checkout, received api://checkout-staging)"
        phase: incident
        per_minute: 14
      - level: ERROR
        message: "token validation failed, rejecting request with 502"
        phase: incident
        per_minute: 6
    deployments:
      - version: v3.1.0
        previous_version: v3.0.4
        at_minute: 0
        # 只有键名，没有值——配置值可能是凭据（威胁 T-3）。
        changed_config_keys:
          - auth.audience
          - auth.tokenCacheTtlSeconds

  # 下游服务本身健康。指标正常是「不该处置它」的证据。
  - name: synthetic-auth
    metrics:
      http_error_rate:
        baseline: 0.001
        incident: 0.001
        shape: flat
        unit: ratio
      http_p99_latency_ms:
        baseline: 45
        incident: 47
        shape: flat
        unit: ms
      cpu_utilisation:
        baseline: 0.22
        incident: 0.23
        shape: flat
        unit: ratio
    logs:
      - level: INFO
        message: "token introspection served in 12ms"
        phase: both
        per_minute: 3
      - level: WARN
        message: "rejected token: audience not in allowlist for client=synthetic-checkout"
        phase: incident
        per_minute: 8
