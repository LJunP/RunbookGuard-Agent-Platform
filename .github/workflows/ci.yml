name: ci

# 三条独立的 job 而不是一条大 job：一个语言的失败不该掩盖另一个语言的状态。
# 合成一条时先失败的那一步会让后面全部 skip，看不出「Java 挂了但 Python 是好的」。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: control-plane (Java 17 + 真实 MySQL/Redis/RabbitMQ)
    runs-on: ubuntu-latest
    # 集成测试用 Testcontainers 起真实中间件，不是 mock（DEV_PROMPT §13）。
    # ubuntu-latest runner 自带 Docker，因此不需要额外 service 声明。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 编译
        working-directory: apps/control-plane-java
        run: mvn -B -ntp compile

      - name: 单元与集成测试
        working-directory: apps/control-plane-java
        run: mvn -B -ntp test

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-surefire-reports
          path: apps/control-plane-java/target/surefire-reports/

  python:
    name: agent-runtime + synthetic-lab (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 agent-runtime
        working-directory: apps/agent-runtime-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: agent-runtime 测试
        working-directory: apps/agent-runtime-python
        # CI 默认 fake provider：零成本、零网络、确定性（DEV_PROMPT §12 M3）。
        # 这里不设 RUNBOOKGUARD_LLM_* ——一旦设了，一次误操作就会烧掉真实预算。
        run: python -m pytest -q

      - name: 安装 synthetic-lab
        working-directory: services/synthetic-lab
        run: pip install -e ".[dev]"

      - name: synthetic-lab 测试
        working-directory: services/synthetic-lab
        run: python -m pytest -q

      - name: 剧本确定性检查
        # 同一剧本连跑三次必须产出相同摘要（M2.5 Gate 条件）。
        # 这一条在 CI 里跑是因为它曾经真的失败过：T0 带秒数导致查询窗口
        # 切在分钟中间，同一剧本三次跑出三个摘要。
        #
        # 起真实进程而不是打桩：脚本校验的是 HTTP 返回体的逐字节一致，
        # 打桩等于校验桩自己。
        run: |
          cd services/synthetic-lab
          python -m uvicorn synthetic_lab.main:app --host 127.0.0.1 --port 8090 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/health >/dev/null && break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          bash scripts/verify-m2_5-determinism.sh

  console:
    name: console-web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console-web/package-lock.json

      - name: 安装
        working-directory: apps/console-web
        run: npm ci

      - name: 类型检查
        working-directory: apps/console-web
        run: npm run typecheck

      - name: 单元测试
        working-directory: apps/console-web
        run: npm test

      - name: 构建
        working-directory: apps/console-web
        run: npm run build

  contracts:
    name: 跨语言契约（摘要测试向量）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 校验 OpenAPI 与事件契约可解析
        run: |
          python -m pip install --upgrade pip pyyaml
          python - <<'PY'
          import json, pathlib, sys, yaml
          ok = True
          for path in pathlib.Path("contracts").rglob("*.yaml"):
              try:
                  yaml.safe_load(path.read_text())
              except Exception as exc:
                  print(f"FAIL {path}: {exc}"); ok = False
          for path in pathlib.Path("contracts").rglob("*.json"):
              try:
                  json.loads(path.read_text())
              except Exception as exc:
                  print(f"FAIL {path}: {exc}"); ok = False
          for path in pathlib.Path("observability").rglob("*.json"):
              try:
                  json.loads(path.read_text())
              except Exception as exc:
                  print(f"FAIL {path}: {exc}"); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Python 侧摘要向量
        working-directory: apps/agent-runtime-python
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/test_digest_vectors.py -q

      - name: Java 侧摘要向量（同一份 JSON）
        working-directory: apps/control-plane-java
        # 两侧读同一个 contracts/tools/digest-test-vectors.json。
        # 各自维护一份向量表就测不到跨语言一致性——那正是这个 job 存在的理由。
        run: mvn -B -ntp test -Dtest=DigestCrossLanguageVectorTest

  compose:
    name: Docker Compose 一键起（M7 Gate 条件）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: compose 配置可解析
        run: docker compose -f deploy/compose/docker-compose.yml config > /dev/null

      - name: 构建全部镜像
        run: docker compose -f deploy/compose/docker-compose.yml build

      - name: 起全栈
        run: docker compose -f deploy/compose/docker-compose.yml up -d

      - name: 等待健康
        run: bash scripts/wait-for-stack.sh

      - name: 冒烟
        run: bash scripts/smoke-m7.sh

      - name: 失败时打印容器日志
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail=120

      - name: 清理
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  k8s:
    name: kind 集群部署与故障演练（M8 Gate 条件）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 建 kind 集群
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.34.0
          config: deploy/k8s/kind-cluster.yaml
          cluster_name: rg-m8

      - name: 核验 CNI 真的执行 NetworkPolicy
        # 这一条必须在部署之前跑：如果 CNI 不执行策略，后面所有
        # 「被拒绝」的断言都会变成假通过。
        run: bash scripts/verify-networkpolicy-enforcement.sh kind-rg-m8

      - name: 构建镜像并部署
        run: bash scripts/k8s-deploy.sh kind-rg-m8

      - name: 故障演练
        run: bash scripts/drill-m8.sh kind-rg-m8

      - name: 失败时导出集群状态
        if: failure()
        run: |
          kubectl -n runbookguard get pods -o wide || true
          kubectl -n runbookguard describe pods || true
          kubectl -n runbookguard get networkpolicy || true
          kubectl -n runbookguard logs -l tier=app --tail=100 --prefix || true
