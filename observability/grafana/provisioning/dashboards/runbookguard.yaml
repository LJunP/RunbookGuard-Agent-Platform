apiVersion: 1

providers:
  - name: RunbookGuard
    orgId: 1
    folder: RunbookGuard
    type: file
    # 面板由文件定义并纳入版本控制，不在 UI 里手改。UI 改动不会进 git，
    # 换一台机器就复现不出来——而 M7 Gate 的条件正是「干净机器能完整复现」。
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
