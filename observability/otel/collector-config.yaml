# OpenTelemetry Collector 配置。
#
# 为什么有 collector 而不是让两个服务直连后端：Java 走 micrometer-tracing-bridge-otel、
# Python 走 opentelemetry-sdk，两者的资源属性与批处理行为不同。collector 是统一
# 归一化与限流的地方，也让「换后端」不需要改两个服务的配置。

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # 限制内存占用。没有它时一次 trace 风暴会把 collector OOM，
  # 而 collector 挂掉会让两个服务的导出器开始堆积重试——observability 自己成了故障源。
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
  # span 属性里可能带上工具结果的内容。两侧服务已经在出口脱敏，这里是第二道防线：
  # 明确删掉几个绝不该出现的键，而不是依赖上游一定做对。
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: api_key
        action: delete
      - key: RUNBOOKGUARD_LLM_API_KEY
        action: delete

exporters:
  # 本地演示：trace 打到 collector 日志。接真实后端（Tempo / Jaeger）时替换这一段，
  # 两个服务的配置不需要改——这正是加 collector 的收益。
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: warn
    metrics:
      # collector 自身的内部指标，含 otelcol_receiver_accepted_spans。
      # 它回答「span 到底有没有送到」——服务侧日志无法区分「没产生」与「没送到」。
      #
      # 刻意不用 prometheus **exporter**：exporter 只处理 metrics 管道，
      # 把它挂到 traces 管道上 collector 会拒绝启动
      # （failed to create "prometheus" exporter for data type "traces"）。
      # 这里要的是 telemetry 自省，不是把 trace 转成指标。
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
