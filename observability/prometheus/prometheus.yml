# Prometheus 抓取配置。
#
# 抓取间隔 15s 而非默认 60s：M8 的故障演练要在几十秒内看到指标变化，
# 60s 的分辨率下一次 Pod 重启可能整个落在两个采样点之间，看起来什么都没发生。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: local-compose

scrape_configs:
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:8080"]
        labels:
          service: control-plane
          plane: java

  - job_name: agent-runtime
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-runtime:8100"]
        labels:
          service: agent-runtime
          plane: python

  - job_name: synthetic-lab
    metrics_path: /metrics
    static_configs:
      - targets: ["synthetic-lab:8090"]
        labels:
          service: synthetic-lab
          plane: python

  # RabbitMQ 自带的 Prometheus 端点（3.13 内置，无需 exporter 插件）。
  # 队列深度是 M8 的 MQ backlog 演练要看的核心指标。
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  # collector 自身产出的 span 计数。它回答「trace 有没有送出去」——
  # 只看服务侧日志无法区分「没产生」与「没送到」。
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
