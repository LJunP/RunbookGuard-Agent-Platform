server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    # 静态资源带 hash 文件名，可以长缓存；index.html 绝不缓存——
    # 缓存它会让浏览器拿着旧 bundle 去请求已经改过的 API 地址。
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # 控制台不代理 API：浏览器直连控制面，跨源由控制面的 CORS 白名单放行。
    # 走代理会让「哪些来源被允许」这个决定从控制面转移到 nginx，
    # 而那台 nginx 的配置不在控制面的审计范围内。
}
